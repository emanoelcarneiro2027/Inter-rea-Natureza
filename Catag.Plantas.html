<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Herbário – Catálogo de Plantas</title>

  <!-- Fontes (opcional: o site funciona sem elas) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Inter:wght@400;500;600&display=swap">

  <!-- Estilos -->
  <link rel="stylesheet" href="Catag.Plantas.css">
</head>
<body>

  <!-- Botão de tema claro/escuro -->
  <button class="theme-btn" id="themeBtn" aria-label="Alternar tema">🌓</button>

  <!-- ==================== TELA 1: INTRODUÇÃO ==================== -->
  <section id="intro" class="screen hero active">
    <span class="floating" style="left:8%; top:15%;">🍃</span>
    <span class="floating" style="right:10%; top:20%; animation-delay:1s;">🌿</span>
    <span class="floating" style="left:14%; bottom:14%; animation-delay:2s;">🌸</span>
    <span class="floating" style="right:15%; bottom:18%; animation-delay:3s;">🪴</span>

    <span class="hero-tag">GUIA DE PLANTAS</span>
    <h1>Conheça o seu<br><span>jardim ideal</span></h1>
    <p class="hero-sub">
      Descubra origem, clima, luz, rega, segurança para pets e dicas práticas
      de cuidado para cada espécie do nosso herbário.
    </p>
    <button class="btn-primary" data-go="catalog">Explorar catálogo →</button>

    <div class="stats">
      <div><b id="statSpecies">0</b><span>espécies</span></div>
      <div><b id="statPet">0</b><span>seguras para pets</span></div>
      <div><b id="statEasy">0</b><span>fáceis de cuidar</span></div>
    </div>
  </section>

  <!-- ==================== TELA 2: CATÁLOGO ==================== -->
  <section id="catalog" class="screen">
    <div class="page-header">
      <div>
        <h2>Catálogo de plantas</h2>
        <p>Clique em um card para ver todos os detalhes.</p>
      </div>
      <button class="btn-back" data-go="intro">← Início</button>
    </div>

    <!-- Busca e filtros -->
    <div class="toolbar">
      <input id="searchInput" class="search" type="search"
             placeholder="🔍 Buscar por nome, região ou clima...">
      <div id="difficultyFilters" class="filters"></div>
      <button class="chip" id="petBtn">🐾 Pet-friendly</button>
      <button class="chip" id="favBtn">❤️ Favoritas</button>
    </div>

    <p class="result-count" id="resultCount"></p>
    <div class="grid" id="plantGrid"></div>
  </section>

  <!-- ==================== JANELA DE DETALHES ==================== -->
  <div class="modal" id="modal">
    <div class="modal-box">
      <button class="modal-close" id="closeBtn" aria-label="Fechar">×</button>
      <button class="modal-nav prev" id="prevBtn" aria-label="Planta anterior">‹</button>
      <button class="modal-nav next" id="nextBtn" aria-label="Próxima planta">›</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <!-- Lógica -->
  <script src="Catag.Plantas.js"></script>
</body>
</html>
