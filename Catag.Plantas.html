<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo de Plantas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="intro" class="screen on">
  <div class="big">🌿</div>
  <h1>Catálogo de Plantas</h1>
  <p class="sub">Um catálogo para conhecer plantas: de onde vêm, quanta luz e água precisam e como cuidar de cada uma.</p>
  <button class="cta" onclick="go('catalog')">Explorar catálogo →</button>
</section>

<section id="catalog" class="screen">
  <header>
    <h2>🌱 Catálogo</h2>
    <button class="back" onclick="go('intro')">← Início</button>
  </header>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
</section>

<div class="modal" id="modal" onclick="if(event.target===this)closeM()">
  <div class="box" role="dialog" aria-modal="true">
    <button class="x" onclick="closeM()" aria-label="Fechar">×</button>
    <div id="detail"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
